[package]
name = "poe-tool"
version = "2.2.0"
description = "Path of Exile (PoE) 繁體中文即時查價、倉庫資產追蹤與 Build 造價計算工具"
authors = ["POE_tool Contributors"]
edition = "2021"

[lib]
name = "poe_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[dependencies]
tauri = { version = "2.1.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-process = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "rustls-tls"] }
regex = "1.10"
flate2 = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
urlencoding = "2.1"
rand = "0.8"
aho-corasick = "1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_Graphics_Gdi"] }
windows-core = "0.61.2"
webview2-com = "0.38.2"
