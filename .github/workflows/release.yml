name: Release (Windows)

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Test Pre-check
        run: npm test

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build Tauri Production App
        run: npx tauri build

      - name: Package Release Assets
        id: package_assets
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release-assets
          
          # Standalone executable
          if (Test-Path "src-tauri/target/release/poe-tool.exe") {
            Copy-Item "src-tauri/target/release/poe-tool.exe" -Destination "release-assets/poe-tool-$tag-windows-x64.exe"
          } elseif (Test-Path "src-tauri/target/release/POE_tool.exe") {
            Copy-Item "src-tauri/target/release/POE_tool.exe" -Destination "release-assets/poe-tool-$tag-windows-x64.exe"
          }
          
          # Copy installer bundles if available (msi / nsis)
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-assets/$($_.Name)"
            }
          }
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-assets/$($_.Name)"
            }
          }
          
          # Create Portable Zip Archive
          Compress-Archive -Path "release-assets/*" -DestinationPath "release-assets/poe-tool-$tag-windows-x64-portable.zip" -Force
          
          # Compute SHA-256 Checksums
          $files = @(Get-ChildItem -Path release-assets -File)
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash
            "$hash  $($file.Name)"
          }
          $checksums | Out-File -FilePath "release-assets/SHA256SUMS.txt" -Encoding utf8
          
          Get-ChildItem -Path release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: POE_tool ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
