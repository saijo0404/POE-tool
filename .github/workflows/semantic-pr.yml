name: "Lint PR Title"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![#\[\(]).+$
          subjectPatternError: |
            PR 標題主旨請勿以括號、Issue 編號或大括號開頭 (例如避免 '[Feat]' 或 '(#123)')。
            關聯 Issue 請於 PR 內文中使用 'Closes #123' 連結。
